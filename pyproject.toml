[project]
name = "bg-assistant"
version = "0.1.0"
description = "Blog + Newsletter Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "graphifyy>=0.7.7",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "resend>=2.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "resend>=2.30.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.46.0",
]
