[project]
name = "bg-assistant"
version = "0.1.0"
description = "Blog + Newsletter Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "graphifyy>=0.7.7",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "resend>=2.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.27",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.12.1",
    "bcrypt<4.0.0",
    "arq>=0.28.0",
    "mjml-python>=1.4.0",
    "jinja2>=3.1.6",
    "svix>=1.57.0",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.0",
    "python-frontmatter>=1.1.0",
    "slowapi>=0.1.9",
    "authlib>=1.7.2",
    "fastapi-cache2[redis]>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "resend>=2.30.0",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.46.0",
]
